<div class="container">
  <h2>Contact Form</h2>

  <form [formGroup]="contactForm" (ngSubmit)="submitForm()">

    <label>Name</label>
    <input type="text" formControlName="name">
    <p *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid">
      Name must contain at least 3 characters.
    </p>

    <label>Email</label>
    <input type="email" formControlName="email">
    <p *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.invalid">
      Enter a valid email address.
    </p>

    <label>Phone</label>
    <input type="text" formControlName="phone">
    <p *ngIf="contactForm.get('phone')?.touched && contactForm.get('phone')?.invalid">
      Phone number must contain exactly 10 digits.
    </p>

    <label>Message</label>
    <textarea formControlName="message"></textarea>
    <p *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.invalid">
      Message must contain at least 10 characters.
    </p>

    <button type="submit">Submit</button>

  </form>
</div>
